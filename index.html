<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solo Gastos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Solo Gastos</title>
<style>
:root{
  --bg:#050607; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --text:#f5f5f7; --dim:#8e8e93; --dim2:#5c5c61;
  --mint:#63f2c3; --blue:#5aa9ff; --up:#ff8a7a; --down:#63f2c3;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;-webkit-touch-callout:none;
}
.orb{position:fixed;z-index:0;pointer-events:none;border-radius:50%;will-change:transform}
.o1{width:520px;height:520px;right:-220px;top:-200px;background:radial-gradient(closest-side,rgba(90,169,255,.22),transparent);animation:drift 18s ease-in-out infinite alternate}
.o2{width:460px;height:460px;left:-230px;top:28vh;background:radial-gradient(closest-side,rgba(99,242,195,.13),transparent);animation:drift 22s -6s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-40px,60px,0) scale(1.18)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:active{transform:scale(.97)}
button,.card{transition:transform .25s var(--ease),background .25s}
svg{display:block}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 120px)}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.01em}
.brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--blue));animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(99,242,195,.5)}50%{box-shadow:0 0 20px rgba(99,242,195,.95)}}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* hero */
.par{margin-top:10px;transform-origin:50% 0;transform:scale(calc(1 - var(--p,0)*.06));opacity:calc(1 - var(--p,0)*.5)}
.hero{position:relative;overflow:hidden;padding:30px 22px 8px}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(99,242,195,.2),transparent 70%);pointer-events:none;animation:breathe 6s ease-in-out infinite}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);transform:translateX(-130%);animation:sweep 2.4s 1.1s var(--ease) 1 forwards}
@keyframes sweep{to{transform:translateX(130%)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
#hero-n{background:linear-gradient(180deg,#fff 35%,#a9b4c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums;
  font-weight:700;letter-spacing:-.045em;line-height:1;font-size:clamp(60px,19vw,88px)}
.big .cents{font-size:.38em;color:var(--dim);letter-spacing:-.01em;font-weight:600}
.big .cur{font-size:.42em;color:var(--dim);font-weight:600;margin-left:2px}
.stats{display:flex;align-items:flex-end;flex-wrap:wrap;gap:14px 28px;margin-top:20px}
.stats small{display:block;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.stats b{font-size:20px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stats b i{font-style:normal;color:var(--dim);font-weight:600;font-size:.8em;margin-left:2px}
.stats .pill{margin-left:auto;animation:pop .6s 1.4s var(--spring) backwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2)}
.pill.up{color:var(--up)} .pill.down{color:var(--down)}
.pill svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.spark{margin:18px -6px 0;position:relative;touch-action:pan-y}
.spark svg{width:100%;height:auto;overflow:visible}
.spark .line{fill:none;stroke:url(#g1);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.intro .spark .line{animation:draw 1.4s .3s var(--ease) both}
.spark .area{fill:url(#g2)}
.intro .spark .area{animation:fade 1.2s .6s both}
.spark .dot{fill:#fff;stroke:var(--mint);stroke-width:3;transition:cx .15s,cy .15s}
.spark .ping{fill:var(--mint);transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite;transition:cx .15s,cy .15s}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
.sparkcap{display:flex;justify-content:space-between;padding:0 6px 18px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.sparkcap b{color:var(--text);font-weight:600}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* sections */
.sec{margin-top:30px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;padding:0 4px}
.sechead h2{font-size:23px;font-weight:700;letter-spacing:-.035em}
.sechead span{font-size:13px;color:var(--dim)}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack i{height:100%;background:var(--c);flex:var(--w);transform-origin:left;border-radius:2px;transition:transform 1.1s var(--ease) calc(.25s + var(--i)*60ms)}
.rise:not(.in) .stack i,.rise:not(.in) .bar i{transform:scaleX(0)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.row:active{background:var(--surface2)}
.ico{flex:none;position:relative;overflow:hidden;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  color:color-mix(in srgb,var(--c) 58%,#fff);
  background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--c) 44%,#16181c),color-mix(in srgb,var(--c) 8%,#0b0c0f) 78%);
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -8px 14px rgba(0,0,0,.28),0 8px 22px color-mix(in srgb,var(--c) 20%,transparent);
  transition:transform .45s var(--spring)}
.ico::before{content:"";position:absolute;inset:0 0 52% 0;background:linear-gradient(180deg,rgba(255,255,255,.17),transparent);pointer-events:none}
.ico svg{position:relative;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 75%,transparent))}
svg .f{fill:currentColor;fill-opacity:.26;stroke:none}
.row:active .ico{transform:scale(.92) rotate(-5deg)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;margin-top:2px;font-size:13px;color:var(--dim)}
.bar{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:99px;transform-origin:left;transition:transform 1.1s var(--ease) calc(.3s + var(--d,0)*70ms)}
.amt{flex:none;text-align:right;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt small{display:block;font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0;margin-top:1px}
.when{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.when.soon{background:rgba(255,196,87,.16);color:#ffc457}
.when.now{background:rgba(255,138,122,.16);color:var(--up);animation:pulse 2s ease-out infinite}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 16px;border-radius:18px;
  background:rgba(90,169,255,.1);border:1px solid rgba(90,169,255,.25);font-size:13px;color:#b9d8ff}
.banner button{font-weight:700;color:#fff;white-space:nowrap}
.empty{padding:34px 22px;text-align:center;color:var(--dim);font-size:15px;line-height:1.5}

/* stagger */
.rise{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .9s var(--ease) calc(var(--d,0)*80ms),transform .9s var(--ease) calc(var(--d,0)*80ms)}
.rise.in{opacity:1;transform:none}
.rise.in:active{transform:scale(.97);transition:transform .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sheet.open .sbody>*{animation:rise .6s var(--ease) both;animation-delay:calc(.12s + var(--k,0)*45ms)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,122,.5)}100%{box-shadow:0 0 0 12px rgba(255,138,122,0)}}

/* fab */
.fab{position:fixed;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:5;
  display:flex;align-items:center;gap:12px;height:64px;padding:0 28px 0 10px;border-radius:99px;color:#fff;
  font-weight:600;font-size:17px;letter-spacing:-.015em;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:0 16px 46px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3);
  animation:fabin 1s 1.1s var(--spring) backwards;
  transition:transform .55s var(--spring),padding .55s var(--spring),gap .55s var(--spring)}
@keyframes fabin{from{transform:translateY(130px);opacity:0}}
.fab .plus{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--mint),var(--blue));animation:plusglow 3.2s ease-in-out infinite;
  transition:transform .5s var(--spring)}
@keyframes plusglow{0%,100%{box-shadow:0 0 14px rgba(99,242,195,.35)}50%{box-shadow:0 0 30px rgba(99,242,195,.75)}}
.fab:active .plus{transform:rotate(90deg) scale(.9)}
.fab .plus svg{width:20px;height:20px;stroke:#04110d;stroke-width:2.8;fill:none;stroke-linecap:round}
.fab .lbl{max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .55s var(--spring),opacity .3s}
.fab.compact{padding-right:10px;gap:0}
.fab.compact .lbl{max-width:0;opacity:0}
body.sheet-open .fab{transform:translateY(170px)}
/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;
  background:#101215;border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;
  transform:translateY(105%);transition:transform .55s var(--spring);padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.sheet.open{transform:none}
.grab{position:sticky;top:0;z-index:2;height:28px;display:grid;place-items:center;touch-action:none;background:linear-gradient(#101215 60%,transparent)}
.grab i{width:38px;height:5px;border-radius:9px;background:rgba(255,255,255,.22)}
.sbody{padding:0 22px}
.sbody h2{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-bottom:4px}
.sbody .lead{color:var(--dim);font-size:14px;margin-bottom:18px}
.field{margin-top:18px}
.field>label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
input,select{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:14px 16px;outline:0;appearance:none;-webkit-appearance:none;color-scheme:dark}
input:focus,select:focus{border-color:rgba(99,242,195,.55)}
.amtwrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 4px}
.amtwrap input{width:auto;max-width:240px;background:none;text-align:right;font-size:56px;font-weight:700;letter-spacing:-.04em;padding:0;field-sizing:content}
.amtwrap span{font-size:28px;color:var(--dim);font-weight:600}
.equiv{text-align:center;color:var(--dim);font-size:14px;min-height:20px;font-variant-numeric:tabular-nums}
.equiv b{color:var(--mint);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 15px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--dim);border:1px solid transparent}
.chips button.on{background:var(--text);color:#000}
.chips.cats button{display:flex;align-items:center;gap:7px}
.chips.cats button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips.cats button.on{background:color-mix(in srgb,var(--c) 28%,#101215);color:#fff;border-color:var(--c)}
.primary{position:relative;overflow:hidden;width:100%;margin-top:26px;height:58px;border-radius:19px;background:linear-gradient(180deg,#fff,#d9e1ea);color:#05070a;font-weight:650;font-size:17px;letter-spacing:-.015em;text-align:center;box-shadow:0 10px 30px rgba(99,242,195,.16),inset 0 1px 0 #fff}
.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(99,242,195,.45) 50%,transparent 65%);transform:translateX(-130%);animation:shine 4.5s 1.2s var(--ease) infinite}
@keyframes shine{0%{transform:translateX(-130%)}30%,100%{transform:translateX(130%)}}
.ghost{width:100%;margin-top:10px;height:54px;border-radius:19px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:16px;letter-spacing:-.01em;text-align:center}
.danger{width:100%;margin-top:10px;height:54px;border-radius:19px;color:var(--up);background:rgba(255,69,58,.09);font-weight:600;font-size:16px;letter-spacing:-.01em;text-align:center}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.setrow small{display:block;color:var(--dim);font-size:13px;margin-top:3px;line-height:1.4}
.toggle{flex:none;width:52px;height:32px;border-radius:99px;background:var(--surface2);position:relative;transition:background .3s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.toggle.on{background:var(--mint)} .toggle.on::after{transform:translateX(20px)}
.toast{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-90px);padding:12px 18px;border-radius:99px;
  background:#f5f5f7;color:#000;font-weight:600;font-size:14px;transition:transform .5s var(--spring);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.ico.has{background:linear-gradient(160deg,#2b2d32,#0c0d0f 70%);border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -10px 16px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.5)}
.ico.has>svg{opacity:0}
.ico .lg{position:absolute;inset:0;display:grid;place-items:center;animation:fade .5s both}
.ico .lg svg{width:66%;height:66%;fill:var(--lc,#fff);stroke:none;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--lc,#fff) 55%,transparent))}
.ico img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .35s}
.ico img.ok{opacity:1}
.ico img.full{object-fit:cover}
.ico img.fav{object-fit:contain;padding:7px}
.link{font-size:14px;font-weight:600;color:var(--mint);padding:4px 2px}
.sw{position:relative;border-radius:22px;overflow:hidden}
.swdel{position:absolute;right:0;top:0;bottom:0;width:100px;background:#ff453a;color:#fff;font-weight:650;font-size:15px;text-align:center}
.swrow{position:relative;background:#17191d;touch-action:pan-y;transition:transform .4s var(--spring),background .25s}
.swrow:active{background:#1d2025}
.namerow{display:flex;align-items:center;gap:12px}
.namerow input{flex:1;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:14px}
.swatches button{width:36px;height:36px;border-radius:50%;background:var(--c)}
.swatches button.on{outline:2px solid #fff;outline-offset:3px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.icons button{height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center}
.icons button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icons button.on{background:var(--text);color:#000}
.toast button{margin-left:14px;font-weight:700;color:#0a7a5a}
.askin{width:92px;flex:none;text-align:right;padding:11px 13px;font-size:17px;border-radius:13px}
.askbtn{flex:none;width:42px;height:42px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center;font-size:24px;font-weight:600;line-height:1}
.askbtn svg{width:18px;height:18px;stroke:#000;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.vartag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mint);background:rgba(99,242,195,.12);padding:2px 7px;border-radius:99px;margin-left:7px;vertical-align:2px}
.payrow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.payrow span{flex:1;color:var(--dim);text-transform:capitalize}
.payrow button{width:34px;height:34px;color:var(--dim);font-size:22px;text-align:center}
.payadd{display:flex;gap:8px;margin-top:12px;align-items:center}
.payadd input[type=month]{flex:1.8;min-width:0;font-size:15px}
.payadd input:not([type=month]){flex:1;min-width:0}
.topr{display:flex;gap:10px}
.bell{position:relative}
.bell .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--up);color:#1a0604;font:700 11px/18px -apple-system,system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg);animation:pop .6s 1.2s var(--spring) backwards}
.bell.has svg{animation:ring 1.4s 1.6s var(--ease) 1;transform-origin:50% 8%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-13deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.sechead.tog{width:100%;align-items:center;gap:10px}
.tog h2{flex:0 1 auto;white-space:nowrap}
.tog .sum{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.tog[aria-expanded=true]{margin-bottom:12px}
.tog[aria-expanded=false]{margin-bottom:0}
.tog[aria-expanded=true] .sum{opacity:0}
.tog .chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.tog .chev svg{width:15px;height:15px;stroke:var(--text);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--spring)}
.tog[aria-expanded=true] .chev svg{transform:rotate(180deg)}

.ok .orbs circle{transform-box:fill-box;transform-origin:50% 50%}

.ok.show .ring path{animation:okdraw .36s 1s var(--ease) forwards}

  0%{opacity:0;clip-path:inset(0 22% 76% 22% round 18px);transform:none;filter:none;animation-timing-function:cubic-bezier(.2,.9,.25,1.04)}

/* ---------- formato ---------- */
const r2 = n => Math.round(n * 100) / 100;

function load(){

/* ---------- cálculos ---------- */
const lastPays = e => (e.payments || []).slice(-3);

const monthly = e => base(e) * FREQ[e.freq].m;

const needsPay = e => !!(e.variable && (e.due || []).length);
function addPayment(e, m, v){
  e.payments = (e.payments || []).filter(p => p.m !== m).concat({m, v:r2(v)}).sort((a, b) => a.m < b.m ? -1 : 1);

const UIKEY = 'sologastos.ui';

function reveal(first){

function sparkSVG(h){

let closing;

  g.onpointermove = e => { if (y0 !== null) sh.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; };

function deleteExpense(id, reopen){

function mountSwipe(sh){
  sh.querySelectorAll('.swrow').forEach(r => {
    let x0 = null, y0 = 0, dx = 0, drag = false;
    r.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; });
    r.addEventListener('pointermove', e => {
      if (x0 === null) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!drag) { if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { drag = true; r.setPointerCapture(e.pointerId); r.style.transition = 'none'; } else return; }
      dx = Math.max(-110, Math.min(0, (r.classList.contains('open') ? -100 : 0) + mx));
      r.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if (x0 === null) return; x0 = null;
      if (!drag) return;
      r.style.transition = ''; const o = dx < -50;
      r.classList.toggle('open', o); r.style.transform = o ? 'translateX(-100px)' : '';
      r._swiped = true; setTimeout(() => r._swiped = false, 60);
    };
    r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
    r.addEventListener('click', e => {
      if (r._swiped) { e.stopPropagation(); e.preventDefault(); return; }
      if (r.classList.contains('open')) { e.stopPropagation(); r.classList.remove('open'); r.style.transform = ''; }
    }, true);
  });
}

  openSheet(`
    <h2>${esc(c.name)}</h2>
    <p class="lead">${money(sum)} € al mes · ${money(r2(sum*12))} € al año${items.length ? '<br>Desliza un gasto a la izquierda para eliminarlo.' : ''}</p>
    <div class="list">${items.map(e => `
      <div class="sw" style="--c:${c.color}">
        <button class="swdel" data-del="${e.id}">Eliminar</button>
        <button class="row swrow" data-edit="${e.id}">
          ${icoHTML(e, c)}
          <span class="meta"><b>${esc(e.name)}</b><small>${e.variable ? `Variable · ${(e.payments || []).length ? 'media de ' + lastPays(e).length + (lastPays(e).length === 1 ? ' cobro' : ' cobros') : 'estimación'}` : e.freq === 'month' ? 'Cada mes' : `${money(e.amount)} € / ${FREQ[e.freq].per}`}${e.next ? ' · ' + shortDate(e.next) : ''}</small></span>
          <span class="amt">${e.variable ? '≈ ' : ''}${money(r2(monthly(e)))} €<small>al mes</small></span>
        </button>
      </div>`).join('')}</div>
    <button class="primary" data-add="${id}">Añadir a ${esc(c.name.toLowerCase())}</button>
    <button class="ghost" data-ecat="${id}">Editar categoría</button>`, mountSwipe);
}

function openCats(){
  openSheet(`
    <h2>Categorías</h2><p class="lead">Toca una para editarla o crea la tuya.</p>
    <div class="list">${S.cats.map(c => { const n = S.expenses.filter(e => e.cat === c.id).length; return `
      <button class="row" data-ecat="${c.id}" style="--c:${c.color}">
        <span class="ico"><svg viewBox="0 0 24 24">${ICONS[c.icon] || ICONS.dots}</svg></span>
        <span class="meta"><b>${esc(c.name)}</b><small>${n} ${n === 1 ? 'gasto' : 'gastos'}</small></span></button>`; }).join('')}</div>
    <button class="primary" data-newcat="1">Nueva categoría</button>`);
}

function openCatForm(id){
  const ex = id ? S.cats.find(c => c.id === id) : null;
  const f = ex ? {...ex} : {name:'', color:COLORS[S.cats.length % COLORS.length], icon:'dots'};
  openSheet(`
    <h2>${ex ? 'Editar categoría' : 'Nueva categoría'}</h2>
    <div class="namerow" id="c-prev" style="margin-top:14px"><span class="ico"></span><input id="c-name" placeholder="Mascotas, regalos…" value="${esc(f.name)}" maxlength="24" autocomplete="off"></div>
    <div class="field"><label>Color</label><div class="swatches" id="c-col">${COLORS.map(k => `<button data-v="${k}" style="--c:${k}" aria-label="Color"></button>`).join('')}</div></div>
    <div class="field"><label>Icono</label><div class="icons" id="c-ico">${Object.keys(ICONS).map(k => `<button data-v="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></button>`).join('')}</div></div>
    <button class="primary" id="c-save">Guardar</button>
    ${ex ? '<button class="danger" id="c-del">Eliminar categoría</button>' : ''}`,
  sh => {
    const paint = () => {
      const p = $('#c-prev'); p.style.setProperty('--c', f.color);
      p.querySelector('.ico').innerHTML = `<svg viewBox="0 0 24 24">${ICONS[f.icon] || ICONS.dots}</svg>`;
      sh.querySelectorAll('#c-col button').forEach(b => b.classList.toggle('on', b.dataset.v === f.color));
      sh.querySelectorAll('#c-ico button').forEach(b => b.classList.toggle('on', b.dataset.v === f.icon));
    };
    paint();
    $('#c-col').onclick = e => { const b = e.target.closest('button'); if (b) { f.color = b.dataset.v; paint(); } };
    $('#c-ico').onclick = e => { const b = e.target.closest('button'); if (b) { f.icon = b.dataset.v; paint(); } };
    if (!ex) setTimeout(() => $('#c-name').focus(), 450);
    $('#c-save').onclick = () => {
      const name = $('#c-name').value.trim();
      if (!name) { toast('Ponle un nombre'); $('#c-name').focus(); return; }
      if (ex) Object.assign(ex, {name, color:f.color, icon:f.icon});
      else S.cats.push({id:'c' + Date.now(), name, color:f.color, icon:f.icon});
      save(); render(); openCats(); success();
    };
    if (ex) $('#c-del').onclick = () => {
      if (S.cats.length <= 1) { toast('Debe quedar al menos una categoría'); return; }
      const n = S.expenses.filter(e => e.cat === ex.id).length;
      const fb = S.cats.find(c => c.id === 'otros' && c.id !== ex.id) || S.cats.find(c => c.id !== ex.id);
      if (!confirm(n ? `Se eliminará «${ex.name}». Sus ${n} gastos pasarán a «${fb.name}».` : `¿Eliminar «${ex.name}»?`)) return;
      S.expenses.forEach(e => { if (e.cat === ex.id) e.cat = fb.id; });
      S.cats = S.cats.filter(c => c.id !== ex.id); save(); render(); openCats(); toast('Categoría eliminada');
    };
  });
}

function openForm(id, catPref){
  const ex = id ? S.expenses.find(e => e.id === id) : null;
  const f = ex ? {...ex} : {name:'', amount:'', freq:'month', cat:catPref || S.cats[0].id, next:'', remind:7, since:ym(new Date()), note:'', domain:''};
  if (!S.cats.some(c => c.id === f.cat)) f.cat = S.cats[0].id;
  openSheet(`
    <h2>${ex ? 'Editar gasto' : 'Nuevo gasto'}</h2>
    <div class="amtwrap"><input id="f-amount" inputmode="decimal" placeholder="0" value="${f.amount === '' ? '' : String(f.amount).replace('.', ',')}" autocomplete="off"><span>€</span></div>
    <div class="equiv" id="f-equiv"></div>
    <div class="field"><label>Nombre</label><div class="namerow" id="f-logo-w" style="--c:${catOf(f.cat).color}">${icoHTML(f, catOf(f.cat))}<input id="f-name" placeholder="Netflix, Repsol, seguro del coche…" value="${esc(f.name)}" autocomplete="off"></div></div>
    <div class="field"><label>Cada cuánto</label><div class="chips" id="f-freq">${Object.entries(FREQ).map(([k, v]) => `<button data-v="${k}" class="${f.freq === k ? 'on' : ''}">${v.l}</button>`).join('')}</div></div>
    <div class="field"><label>Importe</label><div class="chips" id="f-var"><button data-v="0" class="${f.variable ? '' : 'on'}">Fijo</button><button data-v="1" class="${f.variable ? 'on' : ''}">Varía cada mes</button></div></div>
    ${ex ? `<div class="field" id="f-pay-w" style="display:${f.variable ? '' : 'none'}"><label>Cobros registrados</label><div id="f-pays"></div>
      <div class="payadd"><input type="month" id="p-m" value="${ym(new Date())}"><input id="p-v" inputmode="decimal" placeholder="Importe" autocomplete="off"><button class="askbtn" id="p-add" aria-label="Añadir cobro"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>` : ''}
    <div class="field"><label>Categoría</label><div class="chips cats" id="f-cat">${S.cats.map(c => `<button data-v="${c.id}" style="--c:${c.color}" class="${f.cat === c.id ? 'on' : ''}"><i></i>${esc(c.name)}</button>`).join('')}</div></div>
    <div class="field"><label>Web de la empresa (para el logo)</label><input id="f-domain" placeholder="Se detecta sola · ej. repsol.es" value="${esc(f.domain || '')}" autocapitalize="off" autocorrect="off" autocomplete="off"></div>
    <div class="field"><label>Próximo pago o vencimiento</label><input type="date" id="f-next" value="${f.next}"></div>
    <div class="field" id="f-rem-w"><label>Avisarme antes</label>
      <select id="f-remind">${[[0,'No avisar'],[1,'1 día antes'],[3,'3 días antes'],[7,'1 semana antes'],[15,'15 días antes'],[30,'1 mes antes']].map(([v, l]) => `<option value="${v}" ${+f.remind === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Pagándolo desde</label><input type="month" id="f-since" value="${f.since || ''}"></div>
    <div class="field"><label>Nota</label><input id="f-note" placeholder="Nº de póliza, contrato…" value="${esc(f.note || '')}" autocomplete="off"></div>
    <button class="primary" id="f-save">Guardar</button>
    ${ex ? '<button class="danger" id="f-del">Eliminar gasto</button>' : ''}`,
  sh => {
    const amt = $('#f-amount'), num = () => parseFloat(String(amt.value).replace(',', '.'));
    const eq = () => {
      const a = num(), mo = a > 0 ? r2(monthly({variable:f.variable, amount:a, freq:f.freq, payments:(ex && ex.payments) || []})) : 0;
      $('#f-equiv').innerHTML = a > 0
        ? (f.variable ? `Cuenta como <b>≈ ${money(mo)} €/mes</b> · ${ex ? 'media de tus últimos cobros' : 'se guarda como tu último cobro'}` : `= <b>${money(mo)} €/mes</b> · ${money(r2(mo * 12))} €/año`) : '';
      $('#f-rem-w').style.display = $('#f-next').value ? '' : 'none';
    };
    let lt;
    const logo = () => { clearTimeout(lt); lt = setTimeout(() => {
      const c = catOf(f.cat), w = $('#f-logo-w'); w.style.setProperty('--c', c.color);
      w.querySelector('.ico').outerHTML = icoHTML({name:$('#f-name').value, domain:cleanDomain($('#f-domain').value)}, c);
    }, 350); };
    const chips = (sel, key) => sh.querySelector(sel).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      f[key] = b.dataset.v; sh.querySelectorAll(sel + ' button').forEach(x => x.classList.toggle('on', x === b)); eq(); logo();
    });
    chips('#f-freq', 'freq'); chips('#f-cat', 'cat');
    $('#f-var').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      f.variable = b.dataset.v === '1'; sh.querySelectorAll('#f-var button').forEach(x => x.classList.toggle('on', x === b));
      const w = $('#f-pay-w'); if (w) w.style.display = f.variable ? '' : 'none'; eq();
    });
    const drawPays = () => {
      if (!ex) return;
      const ps = [...(ex.payments || [])].reverse().slice(0, 6);
      $('#f-pays').innerHTML = ps.length ? ps.map(p => `<div class="payrow"><span>${monthLabel(p.m)}</span><b>${money(p.v)} €</b><button data-p="${p.m}" aria-label="Eliminar cobro">×</button></div>`).join('')
        : '<div class="equiv" style="text-align:left;padding:4px 0">Aún no hay cobros. Registra el primero.</div>';
    };
    if (ex) {
      drawPays();
      $('#f-pays').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return;
        ex.payments = ex.payments.filter(p => p.m !== b.dataset.p); save(); render(); drawPays(); eq(); });
      $('#p-add').onclick = () => {
        const v = parseFloat(String($('#p-v').value).replace(',', '.')), m = $('#p-m').value;
        if (!(v > 0) || !m) { toast('Pon mes e importe'); return; }
        addPayment(ex, m, v); $('#p-v').value = ''; drawPays(); eq();
      };
    }
    amt.addEventListener('input', eq); $('#f-next').addEventListener('input', eq);
    $('#f-name').addEventListener('input', logo); $('#f-domain').addEventListener('input', logo); eq();
    if (!ex) setTimeout(() => amt.focus(), 450);
    $('#f-save').onclick = () => {
      const a = num(), name = $('#f-name').value.trim();
      if (!(a > 0)) { toast('Pon un importe'); amt.focus(); return; }
      if (!name) { toast('Ponle un nombre'); $('#f-name').focus(); return; }
      const e = {id:ex ? ex.id : 'e' + Date.now(), name, cat:f.cat, amount:r2(a), freq:f.freq, variable:!!f.variable, payments:(ex && ex.payments) || [], due:(ex && ex.due) || [], next:$('#f-next').value,
        remind:+$('#f-remind').value, since:$('#f-since').value || ym(new Date()), note:$('#f-note').value.trim(), domain:cleanDomain($('#f-domain').value)};
      if (!ex && e.variable && e.next && !e.payments.length) e.payments = [{m:ym(parse(addPeriod(e.next, e.freq, -1))), v:e.amount}];
      rollNext(e);
      if (ex) S.expenses[S.expenses.findIndex(x => x.id === ex.id)] = e; else S.expenses.push(e);
      save(); closeSheet(); render(); checkReminders(); success();
    };
    if (ex) $('#f-del').onclick = () => deleteExpense(ex.id, false);
  });
}

function openSettings(){
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  openSheet(`
    <h2>Ajustes</h2><p class="lead">Tus datos se guardan solo en este dispositivo. Los logos se piden a Google por el dominio de cada empresa.</p>
    <div class="setrow"><div>Avisos de vencimiento<small>${perm === 'unsupported' ? 'Este navegador no admite avisos.' : 'Te avisa al abrir la app cuando un gasto está por vencer. En iPhone, añade la app a la pantalla de inicio.'}</small></div>
      <button class="toggle ${S.notif && perm === 'granted' ? 'on' : ''}" id="s-notif" aria-label="Avisos"></button></div>
    <button class="ghost" id="s-cats">Gestionar categorías</button>
    <button class="ghost" id="s-exp">Exportar copia de seguridad</button>
    <button class="ghost" id="s-imp">Importar copia</button>
    <input type="file" id="s-file" accept="application/json" hidden>
    <button class="danger" id="s-clear">Borrar todo y empezar de cero</button>
    <p class="lead" style="text-align:center;margin:18px 0 0;font-size:12px">Solo Gastos · versión 14</p>`,
  () => {
    $('#s-cats').onclick = openCats;
    $('#s-notif').onclick = async e => {
      if (!('Notification' in window)) return;
      if (S.notif) { S.notif = false; save(); e.currentTarget.classList.remove('on'); return; }
      const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      if (p === 'granted') { S.notif = true; save(); e.target.classList.add('on'); checkReminders(); toast('Avisos activados'); }
      else toast('Permiso denegado en el navegador');
    };
    $('#s-exp').onclick = () => {
      const name = `solo-gastos-${iso(new Date())}.json`, json = JSON.stringify(S, null, 2);
      const file = new File([json], name, {type:'application/json'});
      // En el móvil se abre la hoja de compartir (Guardar en Archivos, AirDrop, Mensajes…); si no existe, descarga normal.
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        navigator.share({files:[file], title:'Copia de Solo Gastos'}).catch(e => { if (e.name !== 'AbortError') toast('No se pudo compartir'); });
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('#s-imp').onclick = () => $('#s-file').click();
    $('#s-file').onchange = async e => {
      try {
        const d = JSON.parse(await e.target.files[0].text());
        if (!Array.isArray(d.expenses)) throw 0;
        S = {notif:false, ...d, demo:false}; if (!Array.isArray(S.cats) || !S.cats.length) S.cats = DEFAULT_CATS.map(c => ({...c})); S.expenses.forEach(rollNext); save(); closeSheet(); render(); toast('Copia importada');
      } catch { toast('Archivo no válido'); }
    };
    $('#s-clear').onclick = () => clearAll();
  });
}
function clearAll(){
  if (!confirm('Se borrarán todos los gastos de este dispositivo. ¿Seguro?')) return;
  S.expenses = []; S.demo = false; prev.t = 0; save(); closeSheet(); document.body.classList.add('intro'); painted = false; render(); settleIntro();
}

/* ---------- avisos ---------- */
function checkReminders(){
  if (!S.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  let seen; try { seen = JSON.parse(localStorage.getItem(NKEY)) || {}; } catch { seen = {}; }
  S.expenses.forEach(e => {
    if (!e.next || !e.remind) return;
    const n = daysUntil(e.next), k = e.id + '|' + e.next;
    if (n > e.remind || seen[k]) return;
    seen[k] = 1;
    const body = `${e.name}: ${money(e.amount)} € · ${dueLabel(n).toLowerCase()} (${shortDate(e.next)})`;
    navigator.serviceWorker?.ready.then(r => r.showNotification('Solo Gastos', {body, icon:'icon-192.png', tag:k}))
      .catch(() => new Notification('Solo Gastos', {body}));
  });
  S.expenses.filter(needsPay).forEach(e => {
    const k = 'pay|' + e.id + '|' + e.due[0];
    if (seen[k]) return;
    seen[k] = 1;
    const body = `¿Cuánto te cobraron de ${e.name}? Regístralo para ajustar la media.`;
    navigator.serviceWorker?.ready.then(r => r.showNotification('Solo Gastos', {body, icon:'icon-192.png', tag:k}))
      .catch(() => new Notification('Solo Gastos', {body}));
  });
  try { localStorage.setItem(NKEY, JSON.stringify(seen)); } catch {}
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('#tog-up,#btn-bell,[data-pay],[data-del],[data-ecat],[data-newcat],[data-edit],[data-cat],[data-add],#btn-set,#btn-clear,#btn-cats'); if (!t) return;
  if (t.id === 'tog-up') {
    const open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', open); $('#fold-up').classList.toggle('open', open); setUI('up', open);
  }
  else if (t.dataset.pay) {
    const e = S.expenses.find(x => x.id === t.dataset.pay), v = parseFloat(String(t.closest('.ask').querySelector('input').value).replace(',', '.'));
    if (!(v > 0)) { toast('Escribe el importe cobrado'); return; }
    const inSheet = !!t.closest('#sheet');
    addPayment(e, e.due[0], v); success(); toast(`Cobro registrado · media ≈ ${money(base(e))} €`);
    if (inSheet) openBell();
  }
  else if (t.dataset.del) deleteExpense(t.dataset.del, true);
  else if (t.dataset.ecat) openCatForm(t.dataset.ecat);
  else if (t.dataset.newcat) openCatForm();
  else if (t.id === 'btn-cats') openCats();
  else if (t.dataset.edit) openForm(t.dataset.edit);
  else if (t.dataset.cat) openCat(t.dataset.cat);
  else if (t.dataset.add) openForm(null, t.dataset.add);
  else if (t.id === 'btn-set') openSettings();
  else if (t.id === 'btn-bell') openBell();
  else if (t.id === 'btn-clear') clearAll();
});
$('#fab').onclick = () => openForm();
addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.askin')) e.target.closest('.ask').querySelector('.askbtn').click(); });
let lastY = 0, tick = false;
addEventListener('scroll', () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    const y = Math.max(0, scrollY), par = $('.par'), f = $('#fab');
    if (par) par.style.setProperty('--p', Math.min(1, y / 420).toFixed(3));
    if (y > lastY + 6 && y > 90) f.classList.add('compact'); else if (y < lastY - 6 || y < 90) f.classList.remove('compact');
    lastY = y; tick = false;
  });
}, {passive:true});
document.addEventListener('pointerdown', e => { if (e.target.closest('button') && navigator.vibrate) navigator.vibrate(6); }, {passive:true});
$('#overlay').onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.expenses.forEach(rollNext); render(); checkReminders(); } });

function settleIntro(){ setTimeout(() => document.body.classList.remove('intro'), 2400); }
load(); render(); settleIntro(); checkReminders();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
</script>
</body>
</html>
